# freemind.bithack for Hugo — theme defaults.
# Every value here can be overridden in the site's own hugo.toml.

[module.hugoVersion]
  extended = false
  min = "0.156.0"

[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[outputFormats.atom]
  mediaType = "application/atom+xml"
  baseName = "atom"
  isPlainText = false
  rel = "alternate"

# Search index for theme.js (home page only, one per language)
[outputFormats.searchindex]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true

# JSON Feed 1.1
[mediaTypes."application/feed+json"]
  suffixes = ["json"]
[outputFormats.jsonfeed]
  mediaType = "application/feed+json"
  baseName = "feed"
  isPlainText = true
  rel = "alternate"

# Web app manifest
[outputFormats.webmanifest]
  mediaType = "application/json"
  baseName = "manifest"
  isPlainText = true
  notAlternative = true

# NOTE: Hugo does not merge [outputs], [pagination], [markup] or [related] from a theme.
# Copy them from exampleSite/hugo.toml into your site config.

[params]
  # ---- look -------------------------------------------------------------
  slogan = "TALK IS CHEAP, SHOW ME THE CODE."
  showSlogan = true
  showHeart = true
  # Image shown (blinking) before the slogan instead of the heart, e.g. "images/my-logo.png".
  sloganIcon = ""
  # The bundled favicon.png is a generic pixel terminal icon; point these at your own images.
  favicon = "favicon.png"
  # Image left of the home page title.
  logo = "favicon.png"
  dateFormat = "2006-01-02"

  # ---- sidebar ----------------------------------------------------------
  # Rendered in order from _partials/widgets/<name>.html. Built in:
  # author, search, category, tagcloud, timeline, recent_posts, links.
  # Add your own by creating layouts/_partials/widgets/<name>.html in the site.
  widgets = ["author", "search", "category", "tagcloud", "timeline", "recent_posts", "links"]
  tagcloudLimit = 20
  recentPostsLimit = 5

  # ---- posts ------------------------------------------------------------
  # Posts without <!--more--> show an automatic summary on the home page.
  autoExcerpt = true
  # Table of contents unless a post sets `toc: false`.
  tocDefault = true
  headingAnchors = true
  # Code highlighting: Prism.js + official plugins, loaded from this base URL only on pages with code.
  prismCDN = "https://cdn.jsdelivr.net/npm/prismjs@1.30.0/"
  # Standalone images get a <figure> caption from their title or alt text.
  imageCaptions = true
  # "Series" box for posts in a sub-section (e.g. posts/tutorial/*). Per post: series: false
  seriesNav = true
  relatedPosts = 5
  breadcrumbs = true
  externalLinksNewTab = true
  # "Edit this page" link: repository URL up to (not including) "content/", e.g.
  # "https://github.com/me/blog/edit/main/"
  editURL = ""
  # Share buttons: native (device share menu, touch devices only), x, facebook, linkedin, reddit, telegram, weibo,
  # qzone, wechat (QR code; copies the link on phones), email, copy. [] hides them.
  share = ["native", "x", "linkedin", "reddit", "telegram", "weibo", "qzone", "wechat", "email", "copy"]

  # Math: "auto" renders only on pages with `math: true`; "always" everywhere; "never" off.
  math = "auto"
  # KaTeX output: "mathml" needs no CSS/fonts; "htmlAndMathml" loads katex.css from CDN.
  mathOutput = "mathml"

  [params.feed]
    limit = 20
    # Full post content in RSS / Atom / JSON Feed (false = summaries only).
    fullText = true

  [params.copyright]
    enable = true
    license = "CC BY-NC-SA 4.0"
    licenseURL = "https://creativecommons.org/licenses/by-nc-sa/4.0/"

  [params.comments]
    # "", "giscus" or "valine"
    provider = ""
    # Also show comments on non-article pages (About, Friends, ...). A page can opt out with `comments: false`.
    onPages = true
    # [params.comments.giscus]  repo, repoId, category, categoryId, mapping = "pathname",
    #                           theme = "transparent_dark", lang (auto)

  [params.pageviews]
    # "", "busuanzi" or "vercount"
    provider = ""

  # [params.analytics]  googleId, umami = {src, id}, plausible = {domain, src}, goatcounter, cloudflare, baidu
  # [params.authorCard] avatar, name, bio
  # [[params.social]]   name, icon, url  — or `copy` to copy a value (e.g. a WeChat ID) instead of linking
