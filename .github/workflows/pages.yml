# Builds exampleSite with this theme and publishes it to GitHub Pages:
#   https://zzxzzk115.github.io/hugo-theme-freemind-bithack/
name: Demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.170.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # exampleSite uses `theme = "hugo-theme-freemind-bithack"` with themesDir ../..,
      # so the checkout must sit in a folder with the repository's name (the default).
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build exampleSite
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --source exampleSite --themesDir ../.. --gc --minify \
               --baseURL "${{ steps.pages.outputs.base_url }}/" \
               --destination "${{ github.workspace }}/public"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
