<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
{{ partial "head.html" . }}
<body class="kind-{{ .Kind }}{{ if partial "func/is-article.html" . }} is-article{{ end }}" data-prismjs-copy="{{ T "copy" }}" data-prismjs-copy-success="{{ T "copied" }}" data-prismjs-copy-error="{{ T "copy_failed" }}">
  {{ partial "navigation.html" . }}
  <div class="container">
    <div class="content">
      {{ block "main" . }}{{ end }}
    </div>
  </div>
  <div class="container-narrow">
    <footer>{{ partial "footer.html" . }}</footer>
  </div>
  {{ partial "after_footer.html" . }}
</body>
</html>
